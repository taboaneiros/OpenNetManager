version: '3.8'
services:
  db:
    image: docker.io/postgres:15
    environment:
      POSTGRES_DB: opennetmanager
      POSTGRES_USER: opennetuser
      POSTGRES_PASSWORD: opennetpass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - opennet-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opennetuser"]
      interval: 10s
      timeout: 5s
      retries: 5
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: postgres://opennetuser:opennetpass@db:5432/opennetmanager
    depends_on:
      - db
    networks:
      - opennet-network
    volumes:
      - ./static:/app/static
      - ./media:/app/media
networks:
  opennet-network:
    driver: bridge
volumes:
  postgres_data:
